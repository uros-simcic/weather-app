name: forecast

on:
  schedule:
    # Every 6h rather than once daily. GitHub's scheduler drops runs under load
    # (2026-07-25 was skipped outright, leaving the page on the previous day's
    # forecast), so extra slots give the day several chances to refresh — and
    # the models publish new runs through the day anyway.
    - cron: "30 4,10,16,22 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  forecast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: pip install -r pipeline/requirements.txt

      - run: python3 pipeline/fetch_models.py
      # --latest so this run also refreshes docs/now.json. It was already
      # fetching the observations and throwing the zdaj half away, while
      # now.yml's every-30-min schedule is dropped so hard by GitHub that the
      # median real gap is ~2h — past the 120 min at which app.js rejects
      # now.json and falls back to showing a forecast block as if it were a
      # measurement. Four guaranteed refreshes a day for no extra request.
      - run: python3 pipeline/fetch_obs.py --latest

      # backtest.py pulls ~13 months of history — spec wants it run once at
      # build, then monthly, not on every daily run.
      - name: Run backtest.py (first run or monthly)
        run: |
          if [ ! -f data/blend_decisions.json ] || [ "$(date +%d)" = "01" ]; then
            python3 pipeline/backtest.py
          else
            echo "skipping backtest.py — not day 1 and decisions already exist"
          fi

      - run: python3 pipeline/train.py
      - run: python3 pipeline/blend.py

      # Score yesterday's published forecast against real station readings.
      # Never fail the run over reporting — the forecast itself already shipped.
      - run: python3 pipeline/verify.py
        continue-on-error: true

      # Runs even if an earlier step failed (e.g. a transient upstream API
      # timeout) — commits whatever succeeded rather than losing it.
      # Rebase-and-retry: this job runs for minutes while now.yml pushes every
      # 30 min, so a plain push loses the race (real failure on 2026-07-22
      # left forecast.json stale a whole day).
      - name: Commit changed files
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # docs/now.json too, since the fetch_obs step above runs --latest and
          # writes it — without it that refresh was computed and then dropped.
          git add data/ docs/forecast.json docs/now.json
          git diff --cached --quiet || git commit -m "Update forecast data"
          pushed=""
          for i in 1 2 3 4 5; do
            if git push; then pushed=1; break; fi
            # --autostash so an unstaged leftover can't block the pull.
            # On now.json conflict (now.yml pushed while we trained), keep
            # master's obs — rebase --ours is the onto-branch, i.e. now.yml's
            # fresher reading — then continue so forecast.json still ships.
            # Aborting here used to fail every retry (2026-09-19 #231).
            if git pull --rebase --autostash; then
              sleep 5
              continue
            fi
            for f in docs/now.json data/log_obs.csv; do
              if git ls-files -u -- "$f" | grep -q .; then
                git checkout --ours -- "$f"
                git add -- "$f"
              fi
            done
            if git ls-files -u | grep -q .; then
              echo "unresolved conflicts after keeping master's obs files:"
              git ls-files -u
              git rebase --abort || true
            else
              GIT_EDITOR=true git rebase --continue || git rebase --abort || true
            fi
            sleep 5
          done
          [ -n "$pushed" ] || { echo "push failed after 5 attempts"; exit 1; }

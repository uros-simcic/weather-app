name: now

on:
  schedule:
    # Asking for every 15 min to get every 30. GitHub drops scheduled runs on
    # free runners under load: at */30 the measured median gap between real
    # runs was 121 min, against the 120 min at which app.js declares now.json
    # stale — so more often than not the page fell back to a forecast block.
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  now:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: pip install -r pipeline/requirements.txt

      - run: python3 pipeline/fetch_obs.py --latest
      - run: python3 pipeline/fetch_hail.py

      # Rebase-and-retry push: avoids losing the race against forecast.yml's
      # long-running job (see comment there).
      - name: Commit changed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/log_obs.csv docs/now.json
          git diff --cached --quiet || git commit -m "Update now.json"
          pushed=""
          for i in 1 2 3 4 5; do
            if git push; then pushed=1; break; fi
            # On now.json conflict (forecast.yml pushed a staler obs), keep
            # this job's files — rebase --theirs is the commit being replayed.
            # Aborting used to fail every retry when the other job won the race.
            if git pull --rebase --autostash; then
              sleep 5
              continue
            fi
            for f in docs/now.json data/log_obs.csv; do
              if git ls-files -u -- "$f" | grep -q .; then
                git checkout --theirs -- "$f"
                git add -- "$f"
              fi
            done
            if git ls-files -u | grep -q .; then
              echo "unresolved conflicts after keeping this job's obs files:"
              git ls-files -u
              git rebase --abort || true
            else
              GIT_EDITOR=true git rebase --continue || git rebase --abort || true
            fi
            sleep 5
          done
          [ -n "$pushed" ] || { echo "push failed after 5 attempts"; exit 1; }

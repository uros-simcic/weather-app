<!doctype html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https://meteo.arso.gov.si; media-src https://meteo.arso.gov.si; connect-src 'self'; style-src 'self' 'unsafe-inline'; base-uri 'none'">
<meta name="theme-color" content="#cfd0d4">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Brda – vreme</title>
<!-- ?v= on every asset the browser would otherwise hold on to. Pages serves
     these with cache-control: max-age=600 and the JSON files already carry
     their own cache-buster, so without this the data on screen was fresh while
     the code rendering it was whatever the browser had cached - a deploy could
     look live and still be running the previous version.
     BUMP ALL FOUR TOGETHER on any change to app.js, config.js, style.css or
     icons.svg: the three below and ICONS_VERSION at the top of app.js. -->
<link rel="stylesheet" href="style.css?v=6">
<!-- config.js is imported by app.js, so the browser cannot discover it until
     app.js has downloaded and parsed - a third serial hop before the header can
     be drawn, for a file nothing needs until the last section renders.
     The href must match app.js's import specifier exactly or the preload is
     fetched and then ignored. -->
<link rel="modulepreload" href="config.js?v=6">
</head>
<body>
<div id="icons-holder"></div>

<div class="page">
  <header class="header">
    <div class="header__place glass">Brda: <span id="header-when"></span></div>
    <div class="header__right glass">
      <div class="header__sun-group">
        <span class="header__sun">
          <svg><use href="#icon-sunrise"></use></svg>
          <span id="header-sunrise"></span>
        </span>
        <span class="header__sun">
          <svg><use href="#icon-sunset"></use></svg>
          <span id="header-sunset"></span>
        </span>
      </div>
    </div>
  </header>

  <div id="stale-banner" class="stale-banner" hidden></div>

  <div id="today-row" class="row"></div>
  <div id="week-row" class="row"></div>

  <a id="hail-pill" class="hail-pill card blur-panel" href="https://meteo.arso.gov.si/met/sl/warning/hail/" target="_blank" rel="noopener noreferrer" hidden></a>

  <div id="links" class="links"></div>

  <div id="radar-panel" class="panel card blur-panel">
    <a href="https://meteo.arso.gov.si/met/sl/weather/observ/radar" target="_blank" rel="noopener noreferrer">
      <img id="radar-img" alt="Radar padavin" loading="lazy" referrerpolicy="no-referrer">
    </a>
  </div>
  <div id="satellite-panel" class="panel card blur-panel">
    <a href="https://meteo.arso.gov.si/met/sl/weather/observ/satelit" target="_blank" rel="noopener noreferrer">
      <video id="satellite-video" autoplay loop muted playsinline aria-label="Satelitska slika oblačnosti">
        <source type="video/mp4">
      </video>
    </a>
  </div>

  <footer class="footer">
    Podatki: Open-Meteo (CC BY 4.0) · ARSO · ARPA FVG · GeoSphere Austria
  </footer>
</div>

<script type="module" src="app.js?v=6"></script>
</body>
</html>
